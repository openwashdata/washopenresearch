# Rebuilds the datasets from the committed raw snapshots and sheets with the
# package versions pinned in renv.lock, and fails when they differ from the
# data committed in data/. Kept separate from R-CMD-check, which tests the
# package against current package versions and must not use the lockfile.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

name: pipeline

permissions: read-all

jobs:
  reproducibility:
    runs-on: ubuntu-latest

    name: committed data is reproducible

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # Full history with tags: the validation gate compares each dataset
      # with the last release to see that no article was lost.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          # The R version recorded in renv.lock
          r-version: renv
          use-public-rspm: true

      # Restores renv.lock. The action activates the project in this checkout
      # only; no autoloader is committed.
      - uses: r-lib/actions/setup-renv@v2

      - name: Test the pipeline code
        run: Rscript data-raw/run_tests.R

      - name: Rebuild the datasets and compare with the committed data
        run: Rscript data-raw/check_reproducible.R HEAD
